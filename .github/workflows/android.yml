
name: Build BTST AI MASTER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract app files
        run: |
          unzip -q BTST_AI_MASTER_mobile_starter.zip -d app

      - name: Install and build app
        working-directory: app
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTST-AI-MASTER-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
